# CyberArXiv keyword classifier configuration
#
# Format per class:
#   ClassName:
#     keywords:
#       - keyword one
#       - keyword two
#     weights:            # optional — overrides default nchar(keyword)*0.1
#       keyword one: 3.0
#
# Minimal form (no custom weights):
#   ClassName:
#     keywords:
#       - keyword one
#       - keyword two
#
# To add a new class: append a new block and reload with
#   classify_data(data, keywords_file = "inst/keywords.yml")
# No package rebuild needed.

