name: core
label: "CORE — Open Access Research (Cybersecurity)"
type: json_api
enabled: true
id_prefix: "core:"
language: en

base_url: "https://api.core.ac.uk/v3"
endpoint: "/search/works/"

auth:
  type: bearer
  token: "Yf9IRiK7dVrQvAWDJtoyHm1zl3Pu8cTN"

pagination:
  type: offset
  limit_param: "limit"
  offset_param: "offset"
  page_size: 10
  skip_zero_offset: true

rate_limit_secs: 1.0

query:
  params:
    q: "cybersecurity OR malware OR phishing OR ransomware OR vulnerability OR cryptography OR exploit OR intrusion OR botnet OR firewall"

response:
  results_path: "results"
  total_path: "totalHits"

field_map:
  id: "id"
  title: "title"
  abstract: "abstract"
  link: "downloadUrl"
  authors: "authors[].name"
  published_date: "publishedDate"
  categories: "fieldOfStudy"
