services:
  # ============================================================
  # R Package + Dashboard Service
  # ============================================================
  cyberarxiv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberarxiv
    restart: unless-stopped
    environment:
      - MAX_RESULTS=1000
      - QUERY=
      - CYBERARXIV_DB_PATH=/srv/cyberarxiv/data/cyberarxiv.duckdb
      - ML_SERVICE_URL=http://cyberarxiv-ml:5001
      - MLFLOW_UI_URL=http://localhost:5000
    ports:
      - "8000:8000"
      - "3838:3838"
    volumes:
      - ./data:/srv/cyberarxiv/data
      - ./raw-data:/srv/cyberarxiv/raw-data
      - ./site:/var/www/html
      - ./training_data:/srv/cyberarxiv/training_data
    depends_on:
      cyberarxiv-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/dashboard.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # ML Classification Service (PyTorch + MLflow)
  # ============================================================
  cyberarxiv-ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: cyberarxiv-ml
    restart: unless-stopped
    environment:
      - MODEL_PATH=/srv/cyberarxiv-ml/models/model.pt
      - ML_SERVICE_PORT=5001
      - MLFLOW_TRACKING_URI=http://cyberarxiv-mlflow:5000
      - TRAINING_DATA_DIR=/srv/cyberarxiv-ml/training_data
      - MODELS_DIR=/srv/cyberarxiv-ml/models
    ports:
      - "5001:5001"
    volumes:
      - ./models:/srv/cyberarxiv-ml/models
      - ./training_data:/srv/cyberarxiv-ml/training_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ============================================================
  # MLflow Tracking Server
  # ============================================================
  cyberarxiv-mlflow:
    image: python:3.11-slim
    container_name: cyberarxiv-mlflow
    restart: unless-stopped
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      bash -c "pip install --no-cache-dir mlflow &&
               mlflow server
               --backend-store-uri sqlite:///mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts
               --host 0.0.0.0
               --port 5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
