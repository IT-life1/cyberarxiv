services:
  # ============================================================
  # R Package + Dashboard Service
  # ============================================================
  cyberarxiv:
    image: ghcr.io/it-life1/cyberarxiv:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberarxiv
    restart: unless-stopped
    environment:
      - MAX_RESULTS=1000
      - QUERY=
      - CYBERARXIV_DB_PATH=/srv/cyberarxiv/data/cyberarxiv.duckdb
      - ML_SERVICE_URL=http://cyberarxiv-ml:5001
      - MLFLOW_UI_URL=http://localhost:5000
      # Secrets for collectors (inst/collectors/*.yml). Read via ${VAR}
      # interpolation in collector_registry.R. Leave empty on the host if
      # you don't use that source — the collector will warn and skip.
      - CORE_API_KEY=${CORE_API_KEY:-}
    ports:
      - "3838:3838"
    volumes:
      - ./data:/srv/cyberarxiv/data
      - ./raw-data:/srv/cyberarxiv/raw-data
      - ./training_data:/srv/cyberarxiv/training_data
    depends_on:
      cyberarxiv-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # ML Classification Service (PyTorch + MLflow)
  # ============================================================
  cyberarxiv-ml:
    image: ghcr.io/it-life1/cyberarxiv-ml:latest
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: cyberarxiv-ml
    restart: unless-stopped
    environment:
      - MODEL_PATH=/srv/cyberarxiv-ml/models/model.pt
      - ML_SERVICE_PORT=5001
      - MLFLOW_TRACKING_URI=http://cyberarxiv-mlflow:5000
      - TRAINING_DATA_DIR=/srv/cyberarxiv-ml/training_data
      - MODELS_DIR=/srv/cyberarxiv-ml/models
      # LLM for training data labeling. Source of truth is the UI config
      # (training_data/config.json). These env vars are an opt-in override
      # for headless deployments — leave them unset on the host to let the
      # UI selection win.
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    ports:
      - "5001:5001"
    volumes:
      - ./models:/srv/cyberarxiv-ml/models
      - ./training_data:/srv/cyberarxiv-ml/training_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ============================================================
  # MLflow Tracking Server
  # ============================================================
  cyberarxiv-mlflow:
    image: python:3.11-slim
    container_name: cyberarxiv-mlflow
    restart: unless-stopped
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: bash -c "pip install --no-cache-dir mlflow && mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================================
  # MCP Server (AI assistant interface)
  # ============================================================
  cyberarxiv-mcp:
    image: ghcr.io/it-life1/cyberarxiv-mcp:latest
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: cyberarxiv-mcp
    restart: unless-stopped
    environment:
      - CYBERARXIV_DB_PATH=/data/cyberarxiv.duckdb
      - ML_SERVICE_URL=http://cyberarxiv-ml:5001
      - ML_DEFAULT_MODEL=best_model
      # streamable-http transport exposes the MCP endpoint at /mcp on MCP_PORT
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=5002
      # Optional: enables the fetch_core MCP tool. Get a free key at
      # https://core.ac.uk/services/api. Leave empty to disable.
      - CORE_API_KEY=${CORE_API_KEY:-}
    ports:
      - "5002:5002"
    volumes:
      - ./data:/data
    depends_on:
      cyberarxiv-ml:
        condition: service_healthy
