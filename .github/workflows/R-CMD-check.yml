name: R CMD check

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'inst/**'
      - 'man/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/R-CMD-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'inst/**'
      - 'man/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/R-CMD-check.yml'
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    name: R ${{ matrix.r }} on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        r: ['release']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Suggests packages (shiny, bslib, DT, rhandsontable) aren't strictly
      # required for the core API — keep R CMD check from forcing them.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R ${{ matrix.r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
          needs: check

      - name: Run R CMD check (also runs testthat)
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true
